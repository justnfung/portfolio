<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume | Justin Fung</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body>

  <div id="site-header"></div>

  <main>
    <div class="resume-page wrap">
      
      <!-- Top Action Bar -->
      <div class="resume-actions-bar">
        <div class="resume-header-info">
          <h1 class="resume-title">Resume</h1>
          <span class="resume-subtitle">Justin Fung &bull; CS &amp; Business @ Ivey</span>
        </div>
        <div class="resume-btn-group">
          <a href="../resume.pdf" download="Justin_Fung_Resume.pdf" class="btn btn-primary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download PDF
          </a>
          <a href="../resume.pdf" target="_blank" rel="noopener" class="btn btn-secondary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Open in Tab
          </a>
        </div>
      </div>

      <!-- Clean PDF Document Paper (No grey browser toolbars) -->
      <div class="resume-paper-wrapper">
        <div class="resume-paper" id="resume-container">
          <canvas id="resume-canvas" class="resume-canvas"></canvas>
        </div>
      </div>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/components.js?v=3"></script>
  <script src="../js/main.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfUrl = '../resume.pdf';
    const canvas = document.getElementById('resume-canvas');
    const ctx = canvas.getContext('2d');

    pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
      return pdf.getPage(1);
    }).then(page => {
      const dpr = Math.max(window.devicePixelRatio || 1, 2);
      const viewport = page.getViewport({ scale: dpr * 1.5 });
      
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = '100%';
      canvas.style.height = 'auto';

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      return page.render(renderContext).promise;
    }).catch(err => {
      console.log('PDF.js render error:', err);
    });
  </script>
</body>
</html>
