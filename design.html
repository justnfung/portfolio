<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design | Justin Fung</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>

  <div id="site-header"></div>

  <main>

    <div class="design-page wrap" id="design-showcase">
      
      <!-- 1. PEELGOOD – BUSINESS 2257 SECTION WINNERS -->
      <section class="design-section">
        <h2 class="design-section-header">PEELGOOD – BUSINESS 2257 SECTION WINNERS</h2>
        <div class="design-image-grid" id="grid-feasibility">
          <div class="design-item">
            <img src="media/design/feasibility/1.png" alt="PeelGood Presentation Deck" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/feasibility/2.png" alt="PeelGood Apple Mockup" loading="lazy" />
          </div>
          <div class="design-item">
            <video src="media/design/feasibility/3.mp4" loop muted playsinline preload="metadata"></video>
            <button class="video-play-btn" aria-label="Play or pause video" type="button">
              <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
            </button>
            <button class="video-expand-btn" aria-label="Expand video" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
          </div>
          <div class="design-item">
            <img src="media/design/feasibility/4.png" alt="PeelGood Sticker Roll Orange" loading="lazy" />
          </div>
        </div>
      </section>

      <!-- 2. @western.ssc -->
      <section class="design-section">
        <h2 class="design-section-header">
          <a href="https://www.instagram.com/western.ssc" target="_blank" rel="noopener noreferrer">@western.ssc – SELECT WORK</a>
        </h2>
        <div class="design-image-grid" id="grid-ssc">
          <div class="design-item">
            <img src="media/design/ssc/1.png" alt="@western.ssc - 1" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/ssc/2.png" alt="@western.ssc - 2" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/ssc/3.png" alt="@western.ssc - 3" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/ssc/4.png" alt="@western.ssc - 4" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/ssc/5.png" alt="@western.ssc - 5" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/ssc/6.png" alt="@western.ssc - 6" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/ssc/7.png" alt="@western.ssc - 7" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/ssc/8.png" alt="@western.ssc - 8" loading="lazy" />
          </div>
        </div>
      </section>

      <!-- 3. FREELANCE DESIGNER -->
      <section class="design-section">
        <h2 class="design-section-header">
          <a href="https://www.etsy.com/ca/shop/SleepingOtterStore" target="_blank" rel="noopener noreferrer">FREELANCE DESIGNER – SELECT WORK</a>
        </h2>
        <div class="design-image-grid" id="grid-freelance">
          <div class="design-item">
            <img src="media/design/freelance/1.png" alt="Freelance Designer - 1" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/freelance/2.png" alt="Freelance Designer - 2" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/freelance/3.png" alt="Freelance Designer - 3" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/freelance/4.png" alt="Freelance Designer - 4" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/freelance/5.png" alt="Freelance Designer - 5" loading="lazy" />
          </div>
          <div class="design-item">
            <img src="media/design/freelance/6.png" alt="Freelance Designer - 6" loading="lazy" />
          </div>
        </div>
      </section>

      <!-- 4. OASIS STICKER -->
      <section class="design-section">
        <h2 class="design-section-header">A FUN STICKER I MADE BECAUSE IM A HUGE OASIS FAN</h2>
        <div class="design-image-grid" id="grid-oasis">
          <div class="design-item">
            <img src="media/design/oasis/1.png" alt="Oasis Sticker" loading="lazy" />
          </div>
          <div class="design-item">
            <video src="media/design/oasis/2.mp4" loop playsinline preload="metadata"></video>
            <button class="video-play-btn" aria-label="Play or pause video" type="button">
              <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
            </button>
            <button class="video-expand-btn" aria-label="Expand video" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
          </div>
        </div>
      </section>

    </div>

  </main>

  <div id="site-footer"></div>

  <script src="js/components.js?v=2"></script>
  <script src="js/main.js"></script>
  <script src="js/design-gallery.js?v=13"></script>
</body>
</html>
